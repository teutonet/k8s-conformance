name: t8s-conformance-pr

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 * * * *'

jobs:
  discover:
    if: ${{ github.repository == 'teutonet/k8s-conformance' }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      candidates: ${{ steps.list.outputs.candidates }}
    steps:
      - uses: actions/checkout@v4
      - name: install rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0
      - id: list
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_BOT_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
        run: |
          [[ "${RUNNER_DEBUG:-}" == 1 ]] && set -x
          candidates="$(./scripts/list-t8s-conformance-candidates.sh "${{ vars.S3_BUCKET }}")"
          echo "candidates=${candidates}" >> "$GITHUB_OUTPUT"

  submit:
    needs: discover
    if: ${{ needs.discover.result == 'success' && needs.discover.outputs.candidates != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.discover.outputs.candidates) }}
    steps:
      - name: checkout this repo (for the build script only)
        uses: actions/checkout@v4
        with:
          path: automation

      - name: checkout upstream cncf/k8s-conformance
        uses: actions/checkout@v4
        with:
          repository: cncf/k8s-conformance
          ref: master
          path: upstream
          filter: blob:none
          sparse-checkout: |
            */t8s/
          sparse-checkout-cone-mode: false

      - name: install rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      - name: compute minor
        id: minor
        run: echo "minor=$(echo '${{ matrix.item.version }}' | sed -E 's/\.[0-9]+$//')" >> "$GITHUB_OUTPUT"

      - name: stage submission
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
        working-directory: upstream
        run: ../automation/scripts/build-t8s-submission.sh "${{ matrix.item.version }}" "${{ vars.S3_BUCKET }}"

      - name: open PR upstream
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          path: upstream
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}
          push-to-fork: teutonet/k8s-conformance
          branch: t8s-conformance-v${{ steps.minor.outputs.minor }}
          commit-message: "${{ matrix.item.update && format('feat: update t8s v{0} conformance results', matrix.item.version) || format('feat: add t8s v{0} conformance results', matrix.item.version) }}"
          author: "bot-TeutoNet <108798345+bot-TeutoNet@users.noreply.github.com>"
          committer: "bot-TeutoNet <108798345+bot-TeutoNet@users.noreply.github.com>"
          title: "${{ matrix.item.update && format('Update conformance results for v{0}/t8s', steps.minor.outputs.minor) || format('Conformance results for v{0}/t8s', steps.minor.outputs.minor) }}"
          add-paths: v${{ steps.minor.outputs.minor }}/t8s/*
          body: |
            ### Pre-submission checklist:

            *Please check each of these after submitting your pull request:*

            * [x] If this is a new entry, have you submitted a signed [participation form](https://github.com/cncf/k8s-conformance/tree/master/participation-form)? (t8s already has one on file, see #4306)
            * [ ] Did you include the product/project logo in SVG, EPS or AI format? (no custom logo; falls back to the company logo per `PRODUCT.yaml`)
            * [ ] Does your logo clearly state the name of the product/project and follow the other logo [guidelines](https://github.com/cncf/landscape#logos)?
            * [ ] If your product/project is open source, did you include the `repo_url`? (t8s is a managed service, not open source)
            * [x] Did you copy and paste the [installation and configuration instructions](https://github.com/cncf/k8s-conformance/blob/master/faq.md#can-i-provide-a-link-to-the-installation-directions) into the README.md file in addition to linking to them?

            For a full list of requirements, please refer to these sections of the docs: [_Contents of the PR_](https://github.com/cncf/k8s-conformance/blob/master/instructions.md#contents-of-the-pr), and [_Requirements_](https://github.com/cncf/k8s-conformance/blob/master/instructions.md#requirements).
