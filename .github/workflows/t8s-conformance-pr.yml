name: t8s-conformance-pr

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 * * * *'

jobs:
  discover:
    if: ${{ github.repository == 'teutonet/k8s-conformance' }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: install rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0
      - id: list
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_BOT_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
        run: |
          [[ "${RUNNER_DEBUG:-}" == 1 ]] && set -x
          versions="$(./scripts/list-t8s-conformance-candidates.sh "${{ vars.S3_BUCKET }}")"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  submit:
    needs: discover
    if: ${{ needs.discover.result == 'success' && needs.discover.outputs.versions != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover.outputs.versions) }}
    steps:
      - name: checkout this repo (for the build script only)
        uses: actions/checkout@v4
        with:
          path: automation

      - name: checkout upstream cncf/k8s-conformance
        uses: actions/checkout@v4
        with:
          repository: cncf/k8s-conformance
          ref: master
          path: upstream

      - name: install rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      - name: compute minor
        id: minor
        run: echo "minor=$(echo '${{ matrix.version }}' | sed -E 's/\.[0-9]+$//')" >> "$GITHUB_OUTPUT"

      - name: stage submission
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_REGION: ${{ vars.S3_REGION }}
        working-directory: upstream
        run: ../automation/scripts/build-t8s-submission.sh "${{ matrix.version }}" "${{ vars.S3_BUCKET }}"

      - name: open PR upstream
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          path: upstream
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}
          push-to-fork: teutonet/k8s-conformance
          branch: t8s-conformance-v${{ steps.minor.outputs.minor }}
          commit-message: "feat: add t8s v${{ matrix.version }} conformance results"
          author: "bot-TeutoNet <108798345+bot-TeutoNet@users.noreply.github.com>"
          committer: "bot-TeutoNet <108798345+bot-TeutoNet@users.noreply.github.com>"
          title: "Conformance results for v${{ steps.minor.outputs.minor }}/t8s"
          add-paths: v${{ steps.minor.outputs.minor }}/t8s/*
